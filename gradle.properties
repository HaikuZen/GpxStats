org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# This build runs Gradle on JDK 17 (AGP 8.7 / Gradle 8.9 do not support newer JDKs).
# It is NOT pinned here so the file stays portable (F-Droid, CI, other machines).
# If your default `java` is newer, point Gradle at a JDK 17 without touching this file:
#   echo 'org.gradle.java.home=/path/to/jdk-17' >> ~/.gradle/gradle.properties
# or set org.gradle.java.installations.paths / use a Gradle toolchain.
