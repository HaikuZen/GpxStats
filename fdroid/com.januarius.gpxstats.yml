# F-Droid build recipe for GpxStats.
#
# This file is NOT used by this repository. Copy it to
#   fdroiddata/metadata/com.januarius.gpxstats.yml
# in a merge request against https://gitlab.com/fdroid/fdroiddata
# (or open a Request For Packaging at https://gitlab.com/fdroid/rfp/-/issues).
#
# Keep the `Builds:` list append-only: one entry per release, versionCode
# strictly increasing, never edited after it has been published. See RELEASING.md.

Categories:
  - Sports & Health
License: Apache-2.0
AuthorName: HaikuZen
SourceCode: https://github.com/HaikuZen/GpxStats
IssueTracker: https://github.com/HaikuZen/GpxStats/issues
Changelog: https://github.com/HaikuZen/GpxStats/releases

RepoType: git
Repo: https://github.com/HaikuZen/GpxStats.git

Builds:
  - versionName: "1.1"
    versionCode: 2
    commit: v1.1
    subdir: app
    gradle:
      - yes

  - versionName: "1.2"
    versionCode: 3
    commit: v1.2
    subdir: app
    gradle:
      - yes

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: "1.2"
CurrentVersionCode: 3
